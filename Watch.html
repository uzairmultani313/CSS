<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<style>
    *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
    }
   
    body {
        background: #c9e3f1;
        font-family: Arial, sans-serif;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        
    }
    .card{
        margin-bottom: 1rem;
        margin:auto;
        border: 3px solid black;
    }
    .text-muted {
        text-decoration: line-through;
        margin-right: 230px;
        margin-left: 10px;
    }
    #price {
        /*font-size: 1rem;*/
        color: #333;
        margin-top: 20px;
        margin-left: 20px;
    }
    .Best {
        position: absolute;
        top: 10px;
        left: 10px;
        background-color: #619de1;
        color: #fff;
        padding: 5px 10px;
        font-weight: bold;
        border-radius: 5px;
    }
    .Off {
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: #ff0000;
        color: #fff;
        padding: 5px 10px;
        font-weight: bold;
        border-radius: 50px;
    }
</style>
<body  class="d-flex justify-content-center align-items-center">
    
    <div class="card col-mb-3 mt-4">
        <div class="Best"> Best Seller</div>
        <div class="Off">50% Off</div>
        <div class="Img text-center margin-auto">
            <image src="https://images.unsplash.com/photo-1662384197911-e82189f4dc60?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8cm9sZXglMjB3YXRjaCUyMGltYWdlJTIwc2FsZXN8ZW58MHx8MHx8fDA%3D" alt="Watch" class="img-fluid mb-3" style="width: 377px; height:500px;">
        </div>

        <div class="text-center mb-3">
             <p>2020 Model of the Rolex Submariner Date.</p>
             <p>Features: 40mm Oystersteel case, black  dial,<br> unidirectional rotatable bezel, automatic <br>movement, water-resistant up to 300 meters.</p>
             <p id="price"><b>₹5,000</b><span class="text-muted">$10,000</span></p>

        </div>    
       
    </div>
   
</body>
</html>
