<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!---link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" /----->


</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: aquamarine;
    }

    .navbar{
        width: 100%;
        height: 60px;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        gap: 25px;
        background-color: rgb(135, 221, 238);
        border-bottom: 1px solid #292a2e;
    }

    .nav-link{
        text-decoration: none;
        color: #0240fa;
        font-size: 15px;
        padding: 9px 14px;
        border-radius: 20px;
    }

    .I:hover{
        color :#b902f7;
        background-color: rgb(13, 13, 13);
    }

    .menu-icon{
        display: none;
        width: 24px;
        cursor: pointer;
        flex-direction: column;
    }

    .I span{
        display: flex;
        width: 24px;
        height: 2px;
        background-color: #171616;
        border-radius: 2px;
        margin: 5px;
        visibility: hidden;
        opacity: 1;
    }


    @media(max-width:600px){

        .navbar{
            justify-content: space-between;
            padding: 15px 18px;
            position: relative;
        }

        .I span{
            visibility: visible;
            opacity: 1;
        }
        .menu-icon{
            display: flex;
        }

        .nav-menu{
            position:absolute;
            top: 55px;
            right: 12px;

            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 4px;

            padding: 12px;
            background-color: #111215;
            border: 1px solid #24252a;
            border-radius: 20px;
            width: 200px;


            opacity: 0;
            visibility: hidden;
            z-index: 100;
        }

        .nav-link{
                padding: 12px;
                border-radius: 20px;
        }

        /* open menu on hover */

        .navbar:has(.menu-icon:hover) .nav-menu, 
        .navbar:has(.menu-menu:hover) .nav-menu 
        {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

    }
  </style>

<body>

    <nav class="navbar">
        <a href="#" class="brand">Navbar</a>

        <input type="checkbox" id="menu-toggle">

        <!---button class="btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button--->

        <div class="I" onclick="ToggleMenu()">
            
            <!--i class="fa-sharp fa-solid fa-bars" style="color:black;"></i---->

            <div class="nav-menu">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link active">Features</a>
                <a href="#" class="nav-link active">Pricing</a>
                <a href="#" class="nav-link active">Disabled</a>

            <span></span>
            <span></span>
            <span></span>
            </div>
        </div>



    </nav>



</body>

</html>
